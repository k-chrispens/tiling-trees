<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiling Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .tree-container {
            width: 100%;
            height: calc(100vh - 80px);
            position: relative;
            overflow: hidden;
        }

        .tree-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            transform: translate(-50%, -50%) scale(1);
        }

        #connection-lines {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            overflow: visible;
        }

        #tree-content {
            position: relative;
            z-index: 1;
        }

        .node {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .node-input {
            width: 300px;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s ease;
            background: white;
            text-align: center;
        }

        .node-input:focus {
            outline: none;
            border-color: #333;
        }

        .node-input::placeholder {
            color: #ccc;
            font-style: italic;
        }

        .children-container {
            display: flex;
            gap: 100px;
            margin-top: 100px;
            position: relative;
            justify-content: center;
        }

        .child-node {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #export-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn" onclick="app.exportSVG()">Export SVG</button>
        <button class="btn" onclick="app.exportPNG()">Export PNG</button>
        <button class="btn" onclick="app.reset()">Reset</button>
    </div>

    <div class="tree-container" id="tree-container">
        <div class="tree-wrapper" id="tree-wrapper">
            <svg id="connection-lines"></svg>
            <div id="tree-content">
                <!-- Tree will be rendered here -->
            </div>
        </div>
    </div>

    <canvas id="export-canvas"></canvas>

    <script>
        class TilingTree {
            constructor() {
                this.nodeCounter = 0;
                this.root = this.createNode(null, 'Start typing here...');
                this.focusState = null; // Track which node has focus
                this.scale = 1;
                this.render();
                this.setupZoomControls();
            }

            createNode(parent, placeholder = 'new branch here') {
                return {
                    id: this.nodeCounter++,
                    text: '',
                    placeholder: placeholder,
                    parent: parent,
                    children: []
                };
            }

            isFilled(node) {
                return node.text.trim().length > 0;
            }

            onNodeInput(nodeId, text) {
                const node = this.findNode(this.root, nodeId);
                if (!node) {
                    console.error('Node not found:', nodeId);
                    return;
                }

                const wasFilled = this.isFilled(node);
                node.text = text;
                const isNowFilled = this.isFilled(node);

                // If node just became filled and has no children, create initial 2 branches
                if (!wasFilled && isNowFilled && node.children.length === 0) {
                    node.children.push(this.createNode(node));
                    node.children.push(this.createNode(node));
                }

                // Check if we need to add another placeholder branch
                if (node.parent) {
                    const siblings = node.parent.children;
                    const allSiblingsFilled = siblings.every(s => this.isFilled(s));
                    const hasPlaceholder = siblings.some(s => !this.isFilled(s));

                    // If all siblings are filled and there's no placeholder, add one
                    if (allSiblingsFilled && !hasPlaceholder) {
                        node.parent.children.push(this.createNode(node.parent));
                    }
                }

                this.saveToStorage();
                this.render();
            }

            findNode(node, id) {
                if (node.id === id) return node;
                for (let child of node.children) {
                    const found = this.findNode(child, id);
                    if (found) return found;
                }
                return null;
            }

            renderNode(node, isRoot = false) {
                const div = document.createElement('div');
                div.className = isRoot ? 'node' : 'child-node';

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'node-input';
                input.value = node.text;
                input.placeholder = node.placeholder;
                input.dataset.nodeId = node.id; // Add ID for focus restoration

                input.addEventListener('input', (e) => {
                    this.onNodeInput(node.id, e.target.value);
                });

                div.appendChild(input);

                if (node.children.length > 0) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'children-container';
                    childrenContainer.setAttribute('data-children', node.children.length);

                    node.children.forEach(child => {
                        childrenContainer.appendChild(this.renderNode(child, false));
                    });

                    div.appendChild(childrenContainer);
                }

                return div;
            }

            render() {
                // Save focus state before re-rendering
                const activeElement = document.activeElement;
                if (activeElement && activeElement.classList.contains('node-input')) {
                    const nodeId = activeElement.dataset.nodeId;
                    const cursorPos = activeElement.selectionStart;
                    this.focusState = { nodeId, cursorPos };
                }

                const content = document.getElementById('tree-content');
                content.innerHTML = '';
                content.appendChild(this.renderNode(this.root, true));

                // Restore focus state after re-rendering
                if (this.focusState) {
                    const input = document.querySelector(`input[data-node-id="${this.focusState.nodeId}"]`);
                    if (input) {
                        input.focus();
                        input.setSelectionRange(this.focusState.cursorPos, this.focusState.cursorPos);
                    }
                }

                // Draw connection lines after DOM is ready
                requestAnimationFrame(() => {
                    this.drawConnectionLines();
                });
            }

            getFilledNodes(node) {
                if (!this.isFilled(node)) {
                    return null;
                }

                const result = {
                    id: node.id,
                    text: node.text,
                    children: []
                };

                node.children.forEach(child => {
                    const filledChild = this.getFilledNodes(child);
                    if (filledChild) {
                        result.children.push(filledChild);
                    }
                });

                return result;
            }

            exportSVG() {
                const filledRoot = this.getFilledNodes(this.root);

                if (!filledRoot) {
                    alert('Please add some content to your tree before exporting.');
                    return;
                }

                const svg = this.generateSVG(filledRoot);
                const blob = new Blob([svg], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'tiling-tree.svg';
                a.click();
                URL.revokeObjectURL(url);
            }

            generateSVG(rootNode) {
                const nodeHeight = 50;
                const nodeWidth = 300;
                const horizontalSpacing = 100;
                const verticalSpacing = 120;

                // Calculate layout positions
                const layout = this.calculateLayout(rootNode, 0, 0, nodeWidth, horizontalSpacing, verticalSpacing);

                // Find bounds
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                layout.forEach(item => {
                    minX = Math.min(minX, item.x);
                    maxX = Math.max(maxX, item.x + nodeWidth);
                    minY = Math.min(minY, item.y);
                    maxY = Math.max(maxY, item.y + nodeHeight);
                });

                const padding = 40;
                const width = maxX - minX + padding * 2;
                const height = maxY - minY + padding * 2;
                const offsetX = -minX + padding;
                const offsetY = -minY + padding;

                let svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .node-rect { fill: white; stroke: #000; stroke-width: 1; }
            .node-text { fill: #000; font-family: Arial, sans-serif; font-size: 16px; }
            .branch-line { stroke: #000; stroke-width: 2; fill: none; }
        </style>
    </defs>
    <rect width="${width}" height="${height}" fill="white"/>
`;

                // Draw connections first (so they're behind nodes) - diagonal lines
                layout.forEach(item => {
                    if (item.parentItem) {
                        const x1 = item.parentItem.x + nodeWidth / 2 + offsetX;
                        const y1 = item.parentItem.y + nodeHeight + offsetY;
                        const x2 = item.x + nodeWidth / 2 + offsetX;
                        const y2 = item.y + offsetY;

                        // Draw direct diagonal line from parent to child
                        svg += `    <line class="branch-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />\n`;
                    }
                });

                // Draw nodes
                layout.forEach(item => {
                    const x = item.x + offsetX;
                    const y = item.y + offsetY;

                    svg += `    <rect class="node-rect" x="${x}" y="${y}" width="${nodeWidth}" height="${nodeHeight}" rx="4" />\n`;

                    // Wrap text if too long
                    const text = item.node.text;
                    const maxChars = 40;
                    if (text.length > maxChars) {
                        const line1 = text.substring(0, maxChars);
                        const line2 = text.substring(maxChars, maxChars * 2);
                        svg += `    <text class="node-text" x="${x + nodeWidth / 2}" y="${y + nodeHeight / 2 - 5}" text-anchor="middle">${this.escapeXml(line1)}</text>\n`;
                        svg += `    <text class="node-text" x="${x + nodeWidth / 2}" y="${y + nodeHeight / 2 + 15}" text-anchor="middle">${this.escapeXml(line2)}</text>\n`;
                    } else {
                        svg += `    <text class="node-text" x="${x + nodeWidth / 2}" y="${y + nodeHeight / 2 + 6}" text-anchor="middle">${this.escapeXml(text)}</text>\n`;
                    }
                });

                svg += '</svg>';
                return svg;
            }

            calculateLayout(node, depth, position, nodeWidth, hSpacing, vSpacing) {
                const result = [];
                const y = depth * (50 + vSpacing);

                // First, calculate layouts for all children
                let childrenLayouts = [];
                if (node.children && node.children.length > 0) {
                    let childX = 0;
                    node.children.forEach((child) => {
                        const childLayout = this.calculateLayout(child, depth + 1, childX, nodeWidth, hSpacing, vSpacing);
                        childrenLayouts.push(childLayout);

                        // Calculate width of this subtree
                        const childMaxX = Math.max(...childLayout.map(item => item.x));
                        childX = childMaxX + nodeWidth + hSpacing;
                    });
                }

                // Flatten all child layouts
                const allChildItems = childrenLayouts.flat();

                // Calculate parent position (centered over children, or at position if no children)
                let x;
                if (allChildItems.length > 0) {
                    const firstChild = allChildItems.find(item => node.children.some(c => c.id === item.node.id));
                    const lastChild = [...allChildItems].reverse().find(item => node.children.some(c => c.id === item.node.id));

                    if (firstChild && lastChild) {
                        x = (firstChild.x + lastChild.x + nodeWidth) / 2 - nodeWidth / 2;
                    } else {
                        x = position;
                    }
                } else {
                    x = position;
                }

                const parentItem = {
                    node: node,
                    x: x,
                    y: y,
                    parentItem: null,
                    siblings: null
                };

                result.push(parentItem);

                // Add all children with reference to parent
                if (allChildItems.length > 0) {
                    const directChildren = allChildItems.filter(item => node.children.some(c => c.id === item.node.id));
                    directChildren.forEach(child => {
                        child.parentItem = parentItem;
                        child.siblings = directChildren;
                    });
                    result.push(...allChildItems);
                }

                return result;
            }

            escapeXml(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&apos;');
            }

            exportPNG() {
                const filledRoot = this.getFilledNodes(this.root);

                if (!filledRoot) {
                    alert('Please add some content to your tree before exporting.');
                    return;
                }

                const svg = this.generateSVG(filledRoot);

                // Create an image from SVG
                const img = new Image();
                const blob = new Blob([svg], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);

                img.onload = () => {
                    const canvas = document.getElementById('export-canvas');
                    canvas.width = img.width * 2; // 2x for better quality
                    canvas.height = img.height * 2;
                    const ctx = canvas.getContext('2d');
                    ctx.scale(2, 2);
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, img.width, img.height);
                    ctx.drawImage(img, 0, 0);

                    canvas.toBlob((blob) => {
                        const downloadUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = 'tiling-tree.png';
                        a.click();
                        URL.revokeObjectURL(downloadUrl);
                    });

                    URL.revokeObjectURL(url);
                };

                img.onerror = (e) => {
                    console.error('Error loading image:', e);
                    alert('Error generating PNG. Please try exporting as SVG instead.');
                };

                img.src = url;
            }

            reset() {
                if (confirm('Are you sure you want to reset the tree? This cannot be undone.')) {
                    localStorage.removeItem('tilingTree');
                    this.nodeCounter = 0;
                    this.root = this.createNode(null, 'Start typing here...');
                    this.render();
                }
            }

            saveToStorage() {
                try {
                    localStorage.setItem('tilingTree', JSON.stringify({
                        root: this.root,
                        nodeCounter: this.nodeCounter
                    }));
                } catch (e) {
                    console.warn('Could not save to localStorage:', e);
                }
            }

            loadFromStorage() {
                try {
                    const saved = localStorage.getItem('tilingTree');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.root = data.root;
                        this.nodeCounter = data.nodeCounter || this.findMaxId(this.root) + 1;

                        // Restore parent references (they don't serialize well)
                        this.restoreParentRefs(this.root, null);

                        this.render();
                    }
                } catch (e) {
                    console.warn('Could not load from localStorage:', e);
                }
            }

            restoreParentRefs(node, parent) {
                node.parent = parent;
                if (node.children) {
                    node.children.forEach(child => this.restoreParentRefs(child, node));
                }
            }

            findMaxId(node) {
                let maxId = node.id;
                if (node.children) {
                    node.children.forEach(child => {
                        maxId = Math.max(maxId, this.findMaxId(child));
                    });
                }
                return maxId;
            }

            setupZoomControls() {
                const container = document.getElementById('tree-container');

                // Mouse wheel zoom
                container.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    const delta = e.deltaY;
                    const zoomSpeed = 0.001;
                    const zoomFactor = 1 - delta * zoomSpeed;

                    this.scale *= zoomFactor;
                    this.scale = Math.max(0.1, Math.min(3, this.scale)); // Limit zoom range

                    this.applyTransform();
                }, { passive: false });

                // Trackpad pinch zoom (using wheel event with ctrlKey)
                container.addEventListener('wheel', (e) => {
                    if (e.ctrlKey) {
                        e.preventDefault();

                        const delta = e.deltaY;
                        const zoomSpeed = 0.01;
                        const zoomFactor = 1 - delta * zoomSpeed;

                        this.scale *= zoomFactor;
                        this.scale = Math.max(0.1, Math.min(3, this.scale));

                        this.applyTransform();
                    }
                }, { passive: false });

                // Redraw lines on window resize
                window.addEventListener('resize', () => {
                    this.drawConnectionLines();
                });
            }

            applyTransform() {
                const wrapper = document.getElementById('tree-wrapper');
                wrapper.style.transform = `translate(-50%, -50%) scale(${this.scale})`;
                this.drawConnectionLines();
            }

            drawConnectionLines() {
                const svg = document.getElementById('connection-lines');
                const content = document.getElementById('tree-content');

                if (!svg || !content) return;

                // Clear existing lines
                svg.innerHTML = '';

                // Get all node inputs
                const inputs = content.querySelectorAll('.node-input');

                // Calculate SVG bounds
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

                inputs.forEach(input => {
                    const rect = input.getBoundingClientRect();
                    const contentRect = content.getBoundingClientRect();
                    const x = rect.left - contentRect.left;
                    const y = rect.top - contentRect.top;

                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x + input.offsetWidth);
                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y + input.offsetHeight);
                });

                // Set SVG size with padding
                const padding = 200;
                svg.setAttribute('width', (maxX - minX + padding * 2) || 10000);
                svg.setAttribute('height', (maxY - minY + padding * 2) || 10000);
                svg.style.position = 'absolute';
                svg.style.left = (minX - padding) + 'px';
                svg.style.top = (minY - padding) + 'px';

                const offsetX = -minX + padding;
                const offsetY = -minY + padding;

                inputs.forEach(input => {
                    const nodeId = input.dataset.nodeId;
                    const node = this.findNode(this.root, parseInt(nodeId));

                    if (node && node.children && node.children.length > 0) {
                        const parentRect = input.getBoundingClientRect();
                        const contentRect = content.getBoundingClientRect();
                        const parentX = (parentRect.left - contentRect.left) + input.offsetWidth / 2 + offsetX;
                        const parentY = (parentRect.top - contentRect.top) + input.offsetHeight + offsetY;

                        node.children.forEach((child, index) => {
                            const childInput = content.querySelector(`input[data-node-id="${child.id}"]`);
                            if (childInput) {
                                const childRect = childInput.getBoundingClientRect();
                                const childX = (childRect.left - contentRect.left) + childInput.offsetWidth / 2 + offsetX;
                                const childY = (childRect.top - contentRect.top) + offsetY;

                                // Create line element
                                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                                line.setAttribute('x1', parentX);
                                line.setAttribute('y1', parentY);
                                line.setAttribute('x2', childX);
                                line.setAttribute('y2', childY);
                                line.setAttribute('stroke', '#000');
                                line.setAttribute('stroke-width', '2');

                                svg.appendChild(line);
                            }
                        });
                    }
                });
            }
        }

        // Initialize app
        const app = new TilingTree();
        app.loadFromStorage();
    </script>
</body>
</html>
