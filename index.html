<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiling Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .tree-container {
            width: 100%;
            height: calc(100vh - 80px);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .tree-wrapper {
            transform-origin: center center;
            position: relative;
        }

        #connection-lines {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            overflow: visible;
        }

        #tree-content {
            position: relative;
            z-index: 1;
        }

        .node-input {
            position: absolute;
            min-width: 150px;
            max-width: 600px;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s ease;
            background: white;
            text-align: center;
        }

        .node-input:focus {
            outline: none;
            border-color: #333;
        }

        .node-input::placeholder {
            color: #ccc;
            font-style: italic;
        }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #f56565;
            color: white;
            border: 2px solid white;
            font-size: 12px;
            line-height: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: bold;
        }

        .node-wrapper {
            position: absolute;
        }

        .node-wrapper:hover .delete-btn {
            display: flex;
        }

        #export-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn" onclick="app.exportSVG()">Export SVG</button>
        <button class="btn" onclick="app.exportPNG()">Export PNG</button>
        <button class="btn" onclick="app.reset()">Reset</button>
    </div>

    <div class="tree-container" id="tree-container">
        <div class="tree-wrapper" id="tree-wrapper">
            <svg id="connection-lines"></svg>
            <div id="tree-content">
                <!-- Tree will be rendered here -->
            </div>
        </div>
    </div>

    <canvas id="export-canvas"></canvas>

    <script>
        class TilingTree {
            constructor() {
                this.nodeCounter = 0;
                this.root = this.createNode(null, 'Start typing here...');
                this.focusState = null; // Track which node has focus
                this.scale = 1;
                this.panX = 0;
                this.panY = 0;
                this.isPanning = false;
                this.startPanX = 0;
                this.startPanY = 0;
                this.render();
                this.setupZoomControls();
                this.setupPanControls();
            }

            createNode(parent, placeholder = 'new branch here') {
                return {
                    id: this.nodeCounter++,
                    text: '',
                    placeholder: placeholder,
                    parent: parent,
                    children: []
                };
            }

            isFilled(node) {
                return node.text.trim().length > 0;
            }

            deleteNode(nodeId) {
                // Don't allow deleting the root node
                const node = this.findNode(this.root, nodeId);
                if (!node || node === this.root) {
                    return;
                }

                // Find parent and remove this node
                const parent = node.parent;
                if (parent) {
                    const index = parent.children.indexOf(node);
                    if (index > -1) {
                        parent.children.splice(index, 1);
                    }

                    // If parent has no children left, add two empty placeholders
                    if (parent.children.length === 0 && this.isFilled(parent)) {
                        parent.children.push(this.createNode(parent));
                        parent.children.push(this.createNode(parent));
                    }
                }

                this.saveToStorage();
                this.render();
            }

            measureTextWidth(text, placeholder) {
                // Create temporary canvas to measure text
                if (!this.textMeasureCanvas) {
                    this.textMeasureCanvas = document.createElement('canvas');
                    this.textMeasureContext = this.textMeasureCanvas.getContext('2d');
                    this.textMeasureContext.font = '16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif';
                }

                const displayText = text || placeholder || '';
                const textWidth = this.textMeasureContext.measureText(displayText).width;

                // Add padding (10px on each side) + border (1px each side) + some extra space
                const totalWidth = textWidth + 20 + 2 + 40; // 40px extra for comfort

                // Clamp between min and max
                return Math.max(150, Math.min(600, totalWidth));
            }

            onNodeInput(nodeId, text) {
                const node = this.findNode(this.root, nodeId);
                if (!node) {
                    console.error('Node not found:', nodeId);
                    return;
                }

                const wasFilled = this.isFilled(node);
                node.text = text;
                const isNowFilled = this.isFilled(node);

                // If node just became filled and has no children, create initial 2 branches
                if (!wasFilled && isNowFilled && node.children.length === 0) {
                    node.children.push(this.createNode(node));
                    node.children.push(this.createNode(node));
                }

                // Check if we need to add another placeholder branch
                if (node.parent) {
                    const siblings = node.parent.children;
                    const allSiblingsFilled = siblings.every(s => this.isFilled(s));
                    const hasPlaceholder = siblings.some(s => !this.isFilled(s));

                    // If all siblings are filled and there's no placeholder, add one
                    if (allSiblingsFilled && !hasPlaceholder) {
                        node.parent.children.push(this.createNode(node.parent));
                    }
                }

                this.saveToStorage();
                this.render();
            }

            findNode(node, id) {
                if (node.id === id) return node;
                for (let child of node.children) {
                    const found = this.findNode(child, id);
                    if (found) return found;
                }
                return null;
            }

            render() {
                // Save focus state before re-rendering
                const activeElement = document.activeElement;
                if (activeElement && activeElement.classList.contains('node-input')) {
                    const nodeId = activeElement.dataset.nodeId;
                    const cursorPos = activeElement.selectionStart;
                    this.focusState = { nodeId, cursorPos };
                }

                // Calculate widths for all nodes
                const calculateNodeWidths = (node) => {
                    const width = this.measureTextWidth(node.text, node.placeholder);
                    node._width = width;
                    if (node.children) {
                        node.children.forEach(child => calculateNodeWidths(child));
                    }
                };
                calculateNodeWidths(this.root);

                // Use calculateLayout to position all nodes
                const nodeHeight = 50;
                const hSpacing = 60;
                const vSpacing = 100;

                const layout = this.calculateLayout(this.root, 0, 0, hSpacing, vSpacing);

                // Find bounds
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                layout.forEach(item => {
                    minX = Math.min(minX, item.x);
                    maxX = Math.max(maxX, item.x + item.width);
                    minY = Math.min(minY, item.y);
                    maxY = Math.max(maxY, item.y + nodeHeight);
                });

                const padding = 100;
                const width = maxX - minX + padding * 2;
                const height = maxY - minY + padding * 2;

                const content = document.getElementById('tree-content');
                content.style.width = width + 'px';
                content.style.height = height + 'px';
                content.innerHTML = '';

                // Create absolutely positioned inputs for each node
                layout.forEach(item => {
                    // Create wrapper for input + delete button
                    const wrapper = document.createElement('div');
                    wrapper.className = 'node-wrapper';
                    wrapper.style.left = (item.x - minX + padding) + 'px';
                    wrapper.style.top = (item.y - minY + padding) + 'px';
                    wrapper.style.width = item.width + 'px';
                    wrapper.style.height = '50px';

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'node-input';
                    input.value = item.node.text;
                    input.placeholder = item.node.placeholder;
                    input.dataset.nodeId = item.node.id;
                    input.style.position = 'relative';
                    input.style.left = '0';
                    input.style.top = '0';
                    input.style.width = item.width + 'px';

                    input.addEventListener('input', (e) => {
                        this.onNodeInput(item.node.id, e.target.value);
                    });

                    wrapper.appendChild(input);

                    // Add delete button (not for root node)
                    if (item.node !== this.root) {
                        const deleteBtn = document.createElement('div');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.innerHTML = '×';
                        deleteBtn.title = 'Delete node';
                        deleteBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.deleteNode(item.node.id);
                        });
                        wrapper.appendChild(deleteBtn);
                    }

                    content.appendChild(wrapper);
                });

                // Restore focus state after re-rendering
                if (this.focusState) {
                    const input = document.querySelector(`input[data-node-id="${this.focusState.nodeId}"]`);
                    if (input) {
                        input.focus();
                        input.setSelectionRange(this.focusState.cursorPos, this.focusState.cursorPos);
                    }
                }

                // Draw connection lines after DOM is ready
                requestAnimationFrame(() => {
                    this.drawConnectionLines();
                });
            }

            getFilledNodes(node) {
                if (!this.isFilled(node)) {
                    return null;
                }

                const result = {
                    id: node.id,
                    text: node.text,
                    children: []
                };

                node.children.forEach(child => {
                    const filledChild = this.getFilledNodes(child);
                    if (filledChild) {
                        result.children.push(filledChild);
                    }
                });

                return result;
            }

            exportSVG() {
                const filledRoot = this.getFilledNodes(this.root);

                if (!filledRoot) {
                    alert('Please add some content to your tree before exporting.');
                    return;
                }

                const svg = this.generateSVG(filledRoot);
                const blob = new Blob([svg], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'tiling-tree.svg';
                a.click();
                URL.revokeObjectURL(url);
            }

            generateSVG(rootNode) {
                const nodeHeight = 50;
                const horizontalSpacing = 60;
                const verticalSpacing = 100;

                // Calculate widths for export nodes
                const calculateNodeWidths = (node) => {
                    const width = this.measureTextWidth(node.text, '');
                    node._width = width;
                    if (node.children) {
                        node.children.forEach(child => calculateNodeWidths(child));
                    }
                };
                calculateNodeWidths(rootNode);

                // Calculate layout positions
                const layout = this.calculateLayout(rootNode, 0, 0, horizontalSpacing, verticalSpacing);

                // Find bounds
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                layout.forEach(item => {
                    minX = Math.min(minX, item.x);
                    maxX = Math.max(maxX, item.x + item.width);
                    minY = Math.min(minY, item.y);
                    maxY = Math.max(maxY, item.y + nodeHeight);
                });

                const padding = 40;
                const width = maxX - minX + padding * 2;
                const height = maxY - minY + padding * 2;
                const offsetX = -minX + padding;
                const offsetY = -minY + padding;

                let svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .node-rect { fill: white; stroke: #000; stroke-width: 1; }
            .node-text { fill: #000; font-family: Arial, sans-serif; font-size: 16px; }
            .branch-line { stroke: #000; stroke-width: 2; fill: none; }
        </style>
    </defs>
    <rect width="${width}" height="${height}" fill="white"/>
`;

                // Draw connections first (so they're behind nodes) - diagonal lines
                layout.forEach(item => {
                    if (item.parentItem) {
                        const x1 = item.parentItem.centerX + offsetX;
                        const y1 = item.parentItem.y + nodeHeight + offsetY;
                        const x2 = item.centerX + offsetX;
                        const y2 = item.y + offsetY;

                        // Draw direct diagonal line from parent to child
                        svg += `    <line class="branch-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />\n`;
                    }
                });

                // Draw nodes
                layout.forEach(item => {
                    const x = item.x + offsetX;
                    const y = item.y + offsetY;

                    svg += `    <rect class="node-rect" x="${x}" y="${y}" width="${item.width}" height="${nodeHeight}" rx="4" />\n`;

                    // Text positioning - center of the box
                    const text = item.node.text;
                    svg += `    <text class="node-text" x="${x + item.width / 2}" y="${y + nodeHeight / 2 + 6}" text-anchor="middle">${this.escapeXml(text)}</text>\n`;
                });

                svg += '</svg>';
                return svg;
            }

            calculateLayout(node, depth, position, hSpacing, vSpacing) {
                // Use a modified Reingold-Tilford algorithm for proper tree layout
                const nodeHeight = 50;

                // First pass: Calculate relative positions and subtree extents
                const firstPass = (n, d) => {
                    const nodeWidth = n._width || 150;

                    const info = {
                        node: n,
                        depth: d,
                        width: nodeWidth,
                        x: 0, // Relative position within subtree (center of node)
                        children: [],
                        leftExtent: -nodeWidth / 2,
                        rightExtent: nodeWidth / 2
                    };

                    if (n.children && n.children.length > 0) {
                        // Recursively process children
                        n.children.forEach(child => {
                            info.children.push(firstPass(child, d + 1));
                        });

                        // Position children to avoid overlaps
                        const numChildren = info.children.length;

                        if (numChildren === 1) {
                            // Single child: place directly below (centered)
                            info.children[0].x = 0;
                        } else {
                            // Multiple children: distribute them
                            let positions = [];

                            if (numChildren % 2 === 1) {
                                // Odd number: middle child at 0
                                const middleIndex = Math.floor(numChildren / 2);
                                positions[middleIndex] = 0;

                                // Place children to the left
                                for (let i = middleIndex - 1; i >= 0; i--) {
                                    const rightSibling = info.children[i + 1];
                                    const currentChild = info.children[i];

                                    // Calculate minimum separation
                                    const minSeparation = this.getMinSeparation(
                                        currentChild, rightSibling, hSpacing
                                    );

                                    positions[i] = positions[i + 1] - minSeparation;
                                }

                                // Place children to the right
                                for (let i = middleIndex + 1; i < numChildren; i++) {
                                    const leftSibling = info.children[i - 1];
                                    const currentChild = info.children[i];

                                    // Calculate minimum separation
                                    const minSeparation = this.getMinSeparation(
                                        leftSibling, currentChild, hSpacing
                                    );

                                    positions[i] = positions[i - 1] + minSeparation;
                                }
                            } else {
                                // Even number: center the group
                                positions[0] = 0;

                                // Place remaining children
                                for (let i = 1; i < numChildren; i++) {
                                    const leftSibling = info.children[i - 1];
                                    const currentChild = info.children[i];

                                    const minSeparation = this.getMinSeparation(
                                        leftSibling, currentChild, hSpacing
                                    );

                                    positions[i] = positions[i - 1] + minSeparation;
                                }

                                // Center the group around 0
                                const groupCenter = (positions[0] + positions[numChildren - 1]) / 2;
                                positions = positions.map(p => p - groupCenter);
                            }

                            // Apply positions
                            info.children.forEach((child, i) => {
                                child.x = positions[i];
                            });
                        }

                        // Calculate this node's extents based on children
                        const childExtents = info.children.map(c => ({
                            left: c.x + c.leftExtent,
                            right: c.x + c.rightExtent
                        }));

                        info.leftExtent = Math.min(
                            -nodeWidth / 2,
                            ...childExtents.map(e => e.left)
                        );
                        info.rightExtent = Math.max(
                            nodeWidth / 2,
                            ...childExtents.map(e => e.right)
                        );
                    }

                    return info;
                };

                // Perform first pass
                const treeInfo = firstPass(node, depth);

                // Second pass: Convert relative positions to absolute positions
                const result = [];

                const secondPass = (info, absoluteX, absoluteY, parent) => {
                    const item = {
                        node: info.node,
                        width: info.width,
                        x: absoluteX - info.width / 2, // x is left edge for rendering
                        y: absoluteY,
                        centerX: absoluteX, // Store center for line drawing
                        parentItem: parent,
                        siblings: null
                    };

                    result.push(item);

                    if (info.children.length > 0) {
                        const childY = absoluteY + nodeHeight + vSpacing;
                        const childItems = [];

                        info.children.forEach(childInfo => {
                            const childAbsoluteX = absoluteX + childInfo.x; // Child x is relative to parent center
                            childItems.push(secondPass(childInfo, childAbsoluteX, childY, item));
                        });

                        // Update siblings references
                        const directChildren = childItems.filter(ci =>
                            info.children.some(ch => ch.node.id === ci.node.id)
                        );
                        directChildren.forEach(child => {
                            child.siblings = directChildren;
                        });
                    }

                    return item;
                };

                secondPass(treeInfo, position, depth * (nodeHeight + vSpacing), null);

                return result;
            }

            getMinSeparation(leftTree, rightTree, hSpacing) {
                // Calculate minimum horizontal separation between two subtrees
                // by checking their contours at each level

                // Get contours with actual node widths
                const getContour = (tree, side) => {
                    const contour = []; // Array of {pos, width} objects

                    const traverse = (info, relX, depth) => {
                        if (!contour[depth]) {
                            contour[depth] = {
                                pos: side === 'right' ? -Infinity : Infinity,
                                width: info.width
                            };
                        }

                        if (side === 'right') {
                            // Right edge position
                            const rightEdge = relX + info.width / 2;
                            if (rightEdge > contour[depth].pos) {
                                contour[depth] = { pos: rightEdge, width: info.width };
                            }
                        } else {
                            // Left edge position
                            const leftEdge = relX - info.width / 2;
                            if (leftEdge < contour[depth].pos) {
                                contour[depth] = { pos: leftEdge, width: info.width };
                            }
                        }

                        if (info.children) {
                            info.children.forEach(child => {
                                traverse(child, relX + child.x, depth + 1);
                            });
                        }
                    };

                    traverse(tree, 0, 0);
                    return contour;
                };

                const leftContour = getContour(leftTree, 'right');
                const rightContour = getContour(rightTree, 'left');

                // Find the maximum separation needed
                let maxSeparation = hSpacing;
                const maxDepth = Math.max(leftContour.length, rightContour.length);

                for (let d = 0; d < maxDepth; d++) {
                    const leftInfo = leftContour[d] || leftContour[leftContour.length - 1] || { pos: 0, width: 0 };
                    const rightInfo = rightContour[d] || rightContour[rightContour.length - 1] || { pos: 0, width: 0 };

                    // Separation needed: difference in edge positions + spacing
                    const separation = leftInfo.pos - rightInfo.pos + hSpacing;
                    maxSeparation = Math.max(maxSeparation, separation);
                }

                return maxSeparation;
            }

            escapeXml(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&apos;');
            }

            exportPNG() {
                const filledRoot = this.getFilledNodes(this.root);

                if (!filledRoot) {
                    alert('Please add some content to your tree before exporting.');
                    return;
                }

                const svg = this.generateSVG(filledRoot);

                // Create an image from SVG
                const img = new Image();
                const blob = new Blob([svg], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);

                img.onload = () => {
                    const canvas = document.getElementById('export-canvas');
                    canvas.width = img.width * 2; // 2x for better quality
                    canvas.height = img.height * 2;
                    const ctx = canvas.getContext('2d');
                    ctx.scale(2, 2);
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, img.width, img.height);
                    ctx.drawImage(img, 0, 0);

                    canvas.toBlob((blob) => {
                        const downloadUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = 'tiling-tree.png';
                        a.click();
                        URL.revokeObjectURL(downloadUrl);
                    });

                    URL.revokeObjectURL(url);
                };

                img.onerror = (e) => {
                    console.error('Error loading image:', e);
                    alert('Error generating PNG. Please try exporting as SVG instead.');
                };

                img.src = url;
            }

            reset() {
                if (confirm('Are you sure you want to reset the tree? This cannot be undone.')) {
                    localStorage.removeItem('tilingTree');
                    this.nodeCounter = 0;
                    this.root = this.createNode(null, 'Start typing here...');
                    this.render();
                }
            }

            saveToStorage() {
                try {
                    localStorage.setItem('tilingTree', JSON.stringify({
                        root: this.root,
                        nodeCounter: this.nodeCounter
                    }));
                } catch (e) {
                    console.warn('Could not save to localStorage:', e);
                }
            }

            loadFromStorage() {
                try {
                    const saved = localStorage.getItem('tilingTree');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.root = data.root;
                        this.nodeCounter = data.nodeCounter || this.findMaxId(this.root) + 1;

                        // Restore parent references (they don't serialize well)
                        this.restoreParentRefs(this.root, null);

                        this.render();
                    }
                } catch (e) {
                    console.warn('Could not load from localStorage:', e);
                }
            }

            restoreParentRefs(node, parent) {
                node.parent = parent;
                if (node.children) {
                    node.children.forEach(child => this.restoreParentRefs(child, node));
                }
            }

            findMaxId(node) {
                let maxId = node.id;
                if (node.children) {
                    node.children.forEach(child => {
                        maxId = Math.max(maxId, this.findMaxId(child));
                    });
                }
                return maxId;
            }

            setupZoomControls() {
                const container = document.getElementById('tree-container');

                // Mouse wheel zoom
                container.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    const delta = e.deltaY;
                    const zoomSpeed = 0.001;
                    const zoomFactor = 1 - delta * zoomSpeed;

                    this.scale *= zoomFactor;
                    this.scale = Math.max(0.1, Math.min(3, this.scale)); // Limit zoom range

                    this.applyTransform();
                }, { passive: false });

                // Trackpad pinch zoom (using wheel event with ctrlKey)
                container.addEventListener('wheel', (e) => {
                    if (e.ctrlKey) {
                        e.preventDefault();

                        const delta = e.deltaY;
                        const zoomSpeed = 0.01;
                        const zoomFactor = 1 - delta * zoomSpeed;

                        this.scale *= zoomFactor;
                        this.scale = Math.max(0.1, Math.min(3, this.scale));

                        this.applyTransform();
                    }
                }, { passive: false });

                // Redraw lines on window resize
                window.addEventListener('resize', () => {
                    this.drawConnectionLines();
                });
            }

            applyTransform() {
                const wrapper = document.getElementById('tree-wrapper');
                wrapper.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
                this.drawConnectionLines();
            }

            setupPanControls() {
                const container = document.getElementById('tree-container');

                container.addEventListener('mousedown', (e) => {
                    // Only pan if not clicking on an input
                    if (e.target.classList.contains('node-input')) return;

                    this.isPanning = true;
                    this.startPanX = e.clientX - this.panX;
                    this.startPanY = e.clientY - this.panY;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.isPanning) return;

                    this.panX = e.clientX - this.startPanX;
                    this.panY = e.clientY - this.startPanY;
                    this.applyTransform();
                });

                window.addEventListener('mouseup', () => {
                    if (this.isPanning) {
                        this.isPanning = false;
                        const container = document.getElementById('tree-container');
                        container.style.cursor = 'default';
                    }
                });
            }

            drawConnectionLines() {
                const svg = document.getElementById('connection-lines');
                const content = document.getElementById('tree-content');

                if (!svg || !content) return;

                // Clear existing lines
                svg.innerHTML = '';

                // Get all node wrappers (which contain inputs)
                const wrappers = content.querySelectorAll('.node-wrapper');

                // Helper function to get absolute position within content
                const getPosition = (element) => {
                    let x = 0;
                    let y = 0;
                    let current = element;

                    while (current && current !== content) {
                        x += current.offsetLeft || 0;
                        y += current.offsetTop || 0;
                        current = current.offsetParent;
                    }

                    return { x, y };
                };

                // Calculate SVG bounds
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

                wrappers.forEach(wrapper => {
                    const pos = getPosition(wrapper);
                    minX = Math.min(minX, pos.x);
                    maxX = Math.max(maxX, pos.x + wrapper.offsetWidth);
                    minY = Math.min(minY, pos.y);
                    maxY = Math.max(maxY, pos.y + wrapper.offsetHeight);
                });

                // Set SVG size with padding
                const padding = 200;
                const width = (maxX - minX + padding * 2) || 10000;
                const height = (maxY - minY + padding * 2) || 10000;

                svg.setAttribute('width', width);
                svg.setAttribute('height', height);
                svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
                svg.style.position = 'absolute';
                svg.style.left = (minX - padding) + 'px';
                svg.style.top = (minY - padding) + 'px';

                const offsetX = -minX + padding;
                const offsetY = -minY + padding;

                wrappers.forEach(wrapper => {
                    const input = wrapper.querySelector('.node-input');
                    if (!input) return;

                    const nodeId = input.dataset.nodeId;
                    const node = this.findNode(this.root, parseInt(nodeId));

                    if (node && node.children && node.children.length > 0) {
                        const parentPos = getPosition(wrapper);
                        const parentX = parentPos.x + wrapper.offsetWidth / 2 + offsetX;
                        const parentY = parentPos.y + wrapper.offsetHeight + offsetY;

                        node.children.forEach((child, index) => {
                            const childWrapper = content.querySelector(`.node-wrapper:has(input[data-node-id="${child.id}"])`);
                            if (childWrapper) {
                                const childPos = getPosition(childWrapper);
                                const childX = childPos.x + childWrapper.offsetWidth / 2 + offsetX;
                                const childY = childPos.y + offsetY;

                                // Create line element
                                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                                line.setAttribute('x1', parentX);
                                line.setAttribute('y1', parentY);
                                line.setAttribute('x2', childX);
                                line.setAttribute('y2', childY);
                                line.setAttribute('stroke', '#000');
                                line.setAttribute('stroke-width', '2');

                                svg.appendChild(line);
                            }
                        });
                    }
                });
            }
        }

        // Initialize app
        const app = new TilingTree();
        app.loadFromStorage();
    </script>
</body>
</html>
